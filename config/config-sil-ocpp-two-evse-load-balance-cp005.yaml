active_modules:

  # --- ISO15118-2 HLC (EIM auth, no PnC): one EvseV2G instance per connector ---
  # Separate instances required for safe concurrent HLC sessions
  iso15118_charger_1:
    module: EvseV2G
    config_module:
      device: auto
      tls_security: prohibit     # no TLS needed for EIM-only HLC
    connections:
      security:
        - module_id: evse_security
          implementation_id: main

  iso15118_charger_2:
    module: EvseV2G
    config_module:
      device: auto
      tls_security: prohibit     # no TLS needed for EIM-only HLC
    connections:
      security:
        - module_id: evse_security
          implementation_id: main

  # --- Simulated EV car (ISO15118-2 capable) ---
  iso15118_car:
    module: PyEvJosev
    config_module:
      device: auto
      supported_ISO15118_2: true

  # --- Persistent store (required by OCPP module) ---
  persistent_store:
    module: PersistentStore

  # --- EVSE Manager 1: HLC enabled, EIM auth (no PnC) ---
  evse_manager_1:
    module: EvseManager
    mapping:
      module:
        evse: 1
    config_module:
      connector_id: 1
      evse_id: DE*PNX*E00005*1
      connector_type: "cType2"
      session_logging: true
      session_logging_xml: false
      session_logging_path: /tmp/everest-logs
      ac_hlc_enabled: true           # HLC enabled
      ac_hlc_use_5percent: true
      ac_enforce_hlc: false          # fall back to basic IEC61851 if HLC fails
      external_ready_to_start_charging: false
      request_zero_power_in_idle: true
    connections:
      bsp:
        - module_id: yeti_driver_1
          implementation_id: board_support
      powermeter_grid_side:
        - module_id: yeti_driver_1
          implementation_id: powermeter
      slac:
        - module_id: slac_1
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger_1
          implementation_id: charger
      store:
        - module_id: persistent_store
          implementation_id: main
      connector_lock:
        - module_id: yeti_driver_1
          implementation_id: connector_lock

  # --- EVSE Manager 2: HLC enabled, EIM auth (no PnC) ---
  evse_manager_2:
    module: EvseManager
    mapping:
      module:
        evse: 2
    config_module:
      connector_id: 2
      evse_id: DE*PNX*E00005*2
      connector_type: "cType2"
      session_logging: true
      session_logging_xml: false
      session_logging_path: /tmp/everest-logs
      ac_hlc_enabled: true
      ac_hlc_use_5percent: true
      ac_enforce_hlc: false
      external_ready_to_start_charging: false
      request_zero_power_in_idle: true
    connections:
      bsp:
        - module_id: yeti_driver_2
          implementation_id: board_support
      powermeter_grid_side:
        - module_id: yeti_driver_2
          implementation_id: powermeter
      slac:
        - module_id: slac_2
          implementation_id: evse
      hlc:
        - module_id: iso15118_charger_2
          implementation_id: charger
      store:
        - module_id: persistent_store
          implementation_id: main
      connector_lock:
        - module_id: yeti_driver_2
          implementation_id: connector_lock

  # --- Board support / simulator drivers ---
  yeti_driver_1:
    module: YetiSimulator
    mapping:
      module:
        evse: 1
    config_module:
      connector_id: 1

  yeti_driver_2:
    module: YetiSimulator
    mapping:
      module:
        evse: 2
    config_module:
      connector_id: 2

  # --- SLAC: one instance per connector for independent PLC pairing ---
  slac_1:
    module: SlacSimulator

  slac_2:
    module: SlacSimulator

  # --- EV simulators ---
  ev_manager_1:
    module: EvManager
    config_module:
      connector_id: 1
      auto_enable: true
      auto_exec: false
      auto_exec_commands: sleep 1;iec_wait_pwr_ready;sleep 1;draw_power_regulated 16,3;sleep 30;unplug
    connections:
      ev_board_support:
        - module_id: yeti_driver_1
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      slac:
        - module_id: slac_1
          implementation_id: ev

  ev_manager_2:
    module: EvManager
    config_module:
      connector_id: 2
      auto_enable: true
      auto_exec: false
    connections:
      ev_board_support:
        - module_id: yeti_driver_2
          implementation_id: ev_board_support
      ev:
        - module_id: iso15118_car
          implementation_id: ev
      slac:
        - module_id: slac_2
          implementation_id: ev

  # --- Auth: OCPP validates tokens via SteVe (EIM only) ---
  # token_provider connections from evse_manager_1/2 enable Autocharge:
  # when EV sends EVCCID in SessionSetupReq, EvseManager converts it to
  # an Autocharge token and publishes it here — this is what ties the
  # RemoteStart authorization to the ISO15118 EIM auth step
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      token_provider:
        - module_id: token_provider_1
          implementation_id: main
        - module_id: ocpp
          implementation_id: auth_provider    # RemoteStart tokens from SteVe
        - module_id: evse_manager_1           # Autocharge: EVCCID → token for connector 1
          implementation_id: token_provider
        - module_id: evse_manager_2           # Autocharge: EVCCID → token for connector 2
          implementation_id: token_provider
      token_validator:
        - module_id: ocpp
          implementation_id: auth_validator   # SteVe validates all tokens
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse

  # --- Security: handles V2G TLS handshake certs for HLC ---
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"

  token_provider_1:
    module: DummyTokenProviderManual

  # --- OCPP module: connects to SteVe ---
  ocpp:
    module: OCPP
    config_module:
      ChargePointConfigPath: cp005-everest.json
    connections:
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
      reservation:
        - module_id: auth
          implementation_id: reservation
      auth:
        - module_id: auth
          implementation_id: main
      system:
        - module_id: system
          implementation_id: main
      security:
        - module_id: evse_security
          implementation_id: main
      display_message:
        - module_id: display_message
          implementation_id: display_message
      evse_energy_sink:
        - module_id: grid_connection_point
          implementation_id: external_limits
        - module_id: evse_manager_1_ocpp_sink
          implementation_id: external_limits
        - module_id: evse_manager_2_ocpp_sink
          implementation_id: external_limits

  display_message:
    module: TerminalDisplayMessage

  session_cost:
    module: TerminalCostAndPriceMessage
    connections:
      session_cost:
        - module_id: ocpp
          implementation_id: session_cost

  system:
    module: System

  evse_manager_1_ocpp_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_1
          implementation_id: energy_grid

  evse_manager_2_ocpp_sink:
    module: EnergyNode
    mapping:
      module:
        evse: 2
    config_module:
      fuse_limit_A: 32.0
      phase_count: 3
    connections:
      energy_consumer:
        - module_id: evse_manager_2
          implementation_id: energy_grid

  energy_manager:
    module: EnergyManager
    connections:
      energy_trunk:
        - module_id: grid_connection_point
          implementation_id: energy_grid

  grid_connection_point:
    module: EnergyNode
    mapping:
      module:
        evse: 0
    config_module:
      fuse_limit_A: 40.0
      phase_count: 3
    connections:
      price_information: []
      energy_consumer:
        - module_id: evse_manager_1_ocpp_sink
          implementation_id: energy_grid
        - module_id: evse_manager_2_ocpp_sink
          implementation_id: energy_grid
      powermeter:
        - module_id: yeti_driver_1
          implementation_id: powermeter

  api:
    module: API
    connections:
      evse_manager:
        - module_id: evse_manager_1
          implementation_id: evse
        - module_id: evse_manager_2
          implementation_id: evse
      ocpp:
        - module_id: ocpp
          implementation_id: ocpp_generic
      error_history:
        - module_id: error_history
          implementation_id: error_history

  ev_api:
    module: EvAPI
    connections:
      ev_manager:
        - implementation_id: ev_manager
          module_id: ev_manager_1
        - implementation_id: ev_manager
          module_id: ev_manager_2

  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /tmp/error_history.db

x-module-layout: {}